<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f8fc"/>
      <stop offset="45%" stop-color="#e8f0f8"/>
      <stop offset="100%" stop-color="#d4e2f0"/>
    </linearGradient>
    <radialGradient id="lab-glow" cx="75%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d1e3f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d4e2f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#142c44" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad4)"/>
  <rect width="1200" height="675" fill="url(#lab-glow)"/>

  <!-- Molecular Hex Lattice & Grid -->
  <g transform="translate(850, 320)" opacity="0.3" stroke="#2b6cb0" stroke-width="1.5" fill="none">
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"/>
    <polygon points="104,60 208,120 208,240 104,300 0,240 0,120"/>
    <polygon points="-104,60 0,120 0,240 -104,300 -208,240 -208,120"/>
    <circle cx="0" cy="-120" r="5" fill="#2b6cb0"/>
    <circle cx="104" cy="-60" r="5" fill="#2b6cb0"/>
    <circle cx="104" cy="60" r="5" fill="#2b6cb0"/>
    <circle cx="-104" cy="60" r="5" fill="#2b6cb0"/>
  </g>

  <!-- Left Editorial Block -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#1b4965"/>
    <text x="115" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#ffffff" text-anchor="middle">KLİNİK AKTİF &amp; GÖZENEK</text>

    <text x="250" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#466983">7 DK OKUMA • İÇERİK BİLİMİ</text>

    <text x="0" y="95" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#0c2333" line-height="1.2">
      <tspan x="0" dy="0">BHA Salisilik Asit &amp;</tspan>
      <tspan x="0" dy="54">Niasinamid Uyumu</tspan>
    </text>

    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#314e66">
      <tspan x="0" dy="0">Siyah nokta, genişlemiş gözenek ve sebum</tspan>
      <tspan x="0" dy="28">fazlalığına karşı dermatolojik arındırma rehberi.</tspan>
    </text>

    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="95" height="32" rx="16" fill="#ffffff" stroke="#bcd0e4" stroke-width="1.5"/>
      <text x="47" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1b4965" text-anchor="middle">Cosrx</text>

      <rect x="105" y="0" width="125" height="32" rx="16" fill="#ffffff" stroke="#bcd0e4" stroke-width="1.5"/>
      <text x="167" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1b4965" text-anchor="middle">Dr. Melaxin</text>

      <rect x="240" y="0" width="145" height="32" rx="16" fill="#ffffff" stroke="#bcd0e4" stroke-width="1.5"/>
      <text x="312" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1b4965" text-anchor="middle">BHA Salisilik Asit</text>
    </g>
  </g>

  <!-- Illustration on Right: Laboratory Bottle & Hydrocolloid Patch Pack -->
  <g transform="translate(800, 160)" filter="url(#shadow4)">
    <!-- BHA Liquid Tall Minimalist Bottle (Cosrx aesthetic) -->
    <rect x="-40" y="70" width="110" height="270" rx="16" fill="#ffffff" stroke="#bcd0e4" stroke-width="2"/>
    <rect x="-30" y="120" width="90" height="200" rx="8" fill="#eaf2f8"/>
    <text x="15" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#1b4965" text-anchor="middle">BHA BLACKHEAD</text>
    <text x="15" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" letter-spacing="1" fill="#466983" text-anchor="middle">POWER LIQUID • 2%</text>
    <text x="15" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#1b4965" text-anchor="middle">NIACINAMIDE + BHA</text>
    <!-- Cap -->
    <rect x="-15" y="30" width="60" height="40" rx="4" fill="#0c2333"/>

    <!-- Acne Patch Holographic / Hydrocolloid circular stickers -->
    <g transform="translate(100, 120)">
      <rect x="0" y="0" width="120" height="150" rx="14" fill="#ffffff" stroke="#62b6cb" stroke-width="2"/>
      <text x="60" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#1b4965" text-anchor="middle">EVERYDAY</text>
      <text x="60" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#466983" text-anchor="middle">PIMPLE PATCH</text>
      <circle cx="35" cy="80" r="14" fill="#bee9e8" stroke="#62b6cb" stroke-width="1.5"/>
      <circle cx="85" cy="80" r="14" fill="#bee9e8" stroke="#62b6cb" stroke-width="1.5"/>
      <circle cx="60" cy="115" r="14" fill="#bee9e8" stroke="#62b6cb" stroke-width="1.5"/>
    </g>
  </g>
</svg>
