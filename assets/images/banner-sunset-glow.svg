<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <!-- Sunset Sky & Mediterranean Sea Gradients -->
    <linearGradient id="sunset-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="35%" stop-color="#fbcfe8" />
      <stop offset="65%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <radialGradient id="sunset-sun" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#fde047" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#fb923c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="calm-sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="30%" stop-color="#f472b6" />
      <stop offset="70%" stop-color="#e11d48" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="peach-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="gold-sunset-cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="glow-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#831843" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Sky and Sun Background -->
  <rect width="1600" height="700" fill="url(#sunset-sky)" />
  <rect width="1600" height="700" fill="url(#sunset-sun)" />

  <!-- Distant Mountain Range across the bay -->
  <path d="M1000,430 L1150,370 L1280,410 L1450,350 L1600,400 L1600,470 L1000,470 Z" fill="#9d496e" opacity="0.45" />

  <!-- Calm Sea Water with Sunset Glow -->
  <path d="M0,450 L1600,450 L1600,700 L0,700 Z" fill="url(#calm-sea)" />

  <!-- Translucent Pink Acrylic Arch Structure (Behind Products) -->
  <g transform="translate(1000, 110)">
    <!-- Arch -->
    <path d="M40,280 L40,160 A140,140 0 0,1 320,160 L320,280 Z" fill="url(#peach-arch)" stroke="#ffffff" stroke-width="2" opacity="0.6" />
    <!-- Round disc accent behind -->
    <circle cx="280" cy="220" r="100" fill="#f43f5e" opacity="0.3" stroke="#fbcfe8" stroke-width="2" />
  </g>

  <!-- Marble Travertine Pedestal Surface with Water Reflection -->
  <g transform="translate(760, 410)" filter="url(#glow-shadow)">
    <!-- Main Podium Base -->
    <rect x="0" y="50" width="800" height="70" rx="12" fill="#fdfbf7" stroke="#e7dec8" stroke-width="2" />
    <!-- Gold Trim Line -->
    <rect x="0" y="46" width="800" height="6" fill="url(#gold-sunset-cap)" />
  </g>

  <!-- LEFT HERO COPY ACCENT -->
  <g transform="translate(120, 180)">
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#ffffff" opacity="0.9" />
    <circle cx="21" cy="21" r="7" fill="#be185d" />
    <text x="44" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#be185d" letter-spacing="1.2">PREMIUM GLOW KOLEKSİYONU</text>
    <text x="0" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="-1">Altın Işıltı &amp;</text>
    <text x="0" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#be185d" letter-spacing="-1">Derinlemesine Nem</text>
    <text x="0" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="500" fill="#334155">Glow serum, Hydra barrier serum ve SPF 50 sun fluid lüks bakımı.</text>
  </g>

  <!-- PRODUCT SHOWCASE (Matches Image 4) -->
  <!-- 1. Glow Serum Bottle (Frosted Pink, Far Left) -->
  <g transform="translate(790, 260)" filter="url(#glow-shadow)">
    <rect x="20" y="110" width="105" height="150" rx="18" fill="#fff1f2" stroke="#fecdd3" stroke-width="2" />
    <!-- Label -->
    <text x="72" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">The</text>
    <text x="72" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#0f172a" text-anchor="middle">NextLab</text>
    <text x="72" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#be185d" text-anchor="middle">GLOW SERUM</text>
    <text x="72" y="212" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#64748b" text-anchor="middle">RADIANCE BRIGHTENING</text>
    <!-- Gold Cap & White Bulb -->
    <rect x="42" y="75" width="60" height="35" rx="5" fill="url(#gold-sunset-cap)" />
    <path d="M57,75 C57,45 87,45 87,75 Z" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5" />
  </g>

  <!-- 2. Hydra Serum Bottle (Golden Sparkling, Center Left) -->
  <g transform="translate(930, 200)" filter="url(#glow-shadow)">
    <rect x="20" y="110" width="105" height="170" rx="18" fill="#fef9c3" stroke="#fde047" stroke-width="2" />
    <!-- Golden Flecks -->
    <circle cx="50" cy="180" r="3" fill="#eab308" opacity="0.8" />
    <circle cx="80" cy="210" r="4" fill="#eab308" opacity="0.9" />
    <circle cx="95" cy="240" r="3" fill="#eab308" opacity="0.8" />
    <!-- Label -->
    <text x="72" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">The</text>
    <text x="72" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#0f172a" text-anchor="middle">NextLab</text>
    <text x="72" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#b45309" text-anchor="middle">HYDRA SERUM</text>
    <text x="72" y="212" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#64748b" text-anchor="middle">DEEP HYDRATION</text>
    <!-- Gold Cap & White Bulb -->
    <rect x="42" y="75" width="60" height="35" rx="5" fill="url(#gold-sunset-cap)" />
    <path d="M57,75 C57,45 87,45 87,75 Z" fill="#ffffff" stroke="#fef08a" stroke-width="1.5" />
  </g>

  <!-- 3. Cica Cream Jar (Center Front) -->
  <g transform="translate(1080, 310)" filter="url(#glow-shadow)">
    <rect x="20" y="80" width="200" height="100" rx="14" fill="#ffffff" stroke="#fbcfe8" stroke-width="2" />
    <!-- Big Gold Lid -->
    <rect x="20" y="55" width="200" height="28" rx="6" fill="url(#gold-sunset-cap)" />
    <!-- Label -->
    <text x="120" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">The</text>
    <text x="120" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">NextLab</text>
    <text x="120" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#be185d" text-anchor="middle">CICA CREAM</text>
    <text x="120" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#64748b" text-anchor="middle">SOOTHE &amp; REPAIR</text>
  </g>

  <!-- 4. SPF 50 Sun Fluid Bottle (Far Right) -->
  <g transform="translate(1300, 270)" filter="url(#glow-shadow)">
    <rect x="20" y="90" width="120" height="180" rx="18" fill="#ffffff" stroke="#fbcfe8" stroke-width="2" />
    <!-- Label -->
    <text x="80" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">The</text>
    <text x="80" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#0f172a" text-anchor="middle">NextLab</text>
    <text x="80" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#be185d" text-anchor="middle">SPF 50</text>
    <text x="80" y="192" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#0f172a" text-anchor="middle">SUN FLUID</text>
    <!-- Tall Gold Cylinder Cap -->
    <rect x="42" y="45" width="76" height="48" rx="6" fill="url(#gold-sunset-cap)" />
  </g>

  <!-- Delicate Pink Poppies & Petals in Foreground -->
  <g transform="translate(680, 480)">
    <circle cx="30" cy="30" r="16" fill="#be185d" />
    <ellipse cx="30" cy="8" rx="16" ry="24" fill="#fda4af" stroke="#f43f5e" stroke-width="1.5" opacity="0.9" />
    <ellipse cx="50" cy="20" rx="16" ry="24" transform="rotate(72 50 20)" fill="#fda4af" stroke="#f43f5e" stroke-width="1.5" opacity="0.9" />
    <ellipse cx="42" cy="50" rx="16" ry="24" transform="rotate(144 42 50)" fill="#fda4af" stroke="#f43f5e" stroke-width="1.5" opacity="0.9" />
    <ellipse cx="12" cy="50" rx="16" ry="24" transform="rotate(216 12 50)" fill="#fda4af" stroke="#f43f5e" stroke-width="1.5" opacity="0.9" />
    <ellipse cx="6" cy="20" rx="16" ry="24" transform="rotate(288 6 20)" fill="#fda4af" stroke="#f43f5e" stroke-width="1.5" opacity="0.9" />
    <circle cx="30" cy="30" r="8" fill="#881337" />
  </g>
</svg>
