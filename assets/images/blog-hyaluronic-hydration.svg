<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2fbfe"/>
      <stop offset="45%" stop-color="#e3f5fb"/>
      <stop offset="100%" stop-color="#caebf7"/>
    </linearGradient>
    <radialGradient id="water-glow" cx="75%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#c1eaf9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#caebf7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aqua-serum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38b6db"/>
      <stop offset="100%" stop-color="#007799"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#084252" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad5)"/>
  <rect width="1200" height="675" fill="url(#water-glow)"/>

  <!-- Water Ripple Rings -->
  <g transform="translate(850, 340)" opacity="0.3" stroke="#0284c7" stroke-width="2" fill="none">
    <ellipse cx="0" cy="0" rx="260" ry="120"/>
    <ellipse cx="0" cy="0" rx="190" ry="85" stroke-dasharray="6 6"/>
    <ellipse cx="0" cy="0" rx="120" ry="50"/>
  </g>

  <!-- Left Editorial Block -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#0284c7"/>
    <text x="115" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#ffffff" text-anchor="middle">NEM MİMARİSİ &amp; 5D HYALU</text>

    <text x="250" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#2d6f85">6 DK OKUMA • NEM REHBERİ</text>

    <text x="0" y="95" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#04384a" line-height="1.2">
      <tspan x="0" dy="0">5D Hyalüronik Asit ile</tspan>
      <tspan x="0" dy="54">Derinlemesine Nem Bombası</tspan>
    </text>

    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#1b5a6f">
      <tspan x="0" dy="0">Moleküler ağırlıklarına göre katman katman</tspan>
      <tspan x="0" dy="28">nem bağlama ve dolgunlaştırma stratejileri.</tspan>
    </text>

    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="105" height="32" rx="16" fill="#ffffff" stroke="#99d6ea" stroke-width="1.5"/>
      <text x="52" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0284c7" text-anchor="middle">Torriden</text>

      <rect x="115" y="0" width="100" height="32" rx="16" fill="#ffffff" stroke="#99d6ea" stroke-width="1.5"/>
      <text x="165" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0284c7" text-anchor="middle">Isntree</text>

      <rect x="225" y="0" width="145" height="32" rx="16" fill="#ffffff" stroke="#99d6ea" stroke-width="1.5"/>
      <text x="297" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0284c7" text-anchor="middle">Hyalüronik Asit</text>
    </g>
  </g>

  <!-- Illustration on Right: Torriden Style Sky-Blue Serum Bottle + Water Droplets -->
  <g transform="translate(810, 160)" filter="url(#shadow5)">
    <!-- Dropper Serum Glass (Torriden Dive-In aesthetic) -->
    <rect x="-40" y="70" width="120" height="250" rx="26" fill="#ffffff" stroke="#99d6ea" stroke-width="2"/>
    <rect x="-30" y="110" width="100" height="195" rx="18" fill="#bfe7f6" fill-opacity="0.6"/>
    <text x="20" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#0284c7" text-anchor="middle">DIVE-IN SERUM</text>
    <text x="20" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" letter-spacing="1" fill="#0369a1" text-anchor="middle">5D HYALURONIC ACID</text>
    <text x="20" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#0284c7" text-anchor="middle">DEEP HYDRATION • 50ml</text>

    <!-- Dropper Cap -->
    <rect x="-10" y="35" width="60" height="35" rx="4" fill="#ffffff" stroke="#99d6ea" stroke-width="1"/>
    <path d="M 5,35 C 5,10 35,10 35,35 Z" fill="#0284c7"/>

    <!-- Dynamic Moisture Droplet -->
    <g transform="translate(130, 120)">
      <path d="M 30,0 C 30,0 60,40 60,65 C 60,82 46,95 30,95 C 14,95 0,82 0,65 C 0,40 30,0 30,0 Z" fill="url(#aqua-serum)" opacity="0.85"/>
      <ellipse cx="20" cy="65" rx="6" ry="12" fill="#ffffff" fill-opacity="0.7"/>
    </g>

    <circle cx="-60" cy="220" r="12" fill="#ffffff" stroke="#99d6ea" stroke-width="2"/>
    <circle cx="160" cy="270" r="8" fill="#38b6db"/>
  </g>
</svg>
