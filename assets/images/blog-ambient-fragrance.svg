<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-grad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c252e"/>
      <stop offset="45%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#141a20"/>
    </linearGradient>
    <radialGradient id="amber-glow" cx="75%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#8a6d2b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#141a20" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8222"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg-grad6)"/>
  <rect width="1200" height="675" fill="url(#amber-glow)"/>

  <!-- Ultrasonic Scent Wave Ripples -->
  <g transform="translate(860, 310)" opacity="0.25" stroke="#d4af37" stroke-width="1.5" fill="none">
    <ellipse cx="0" cy="0" rx="280" ry="140" stroke-dasharray="4 6"/>
    <ellipse cx="0" cy="0" rx="200" ry="100"/>
    <ellipse cx="0" cy="0" rx="120" ry="60" stroke-dasharray="8 4"/>
  </g>

  <!-- Left Editorial Block -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="220" height="36" rx="18" fill="url(#gold-foil)"/>
    <text x="110" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#141a20" text-anchor="middle">KOKU MİMARİSİ &amp; YAŞAM</text>

    <text x="240" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#cfb67e">5 DK OKUMA • KURUMSAL DİFÜZYON</text>

    <text x="0" y="95" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#ffffff" line-height="1.2">
      <tspan x="0" dy="0">Soğuk Mikro-Difüzyon &amp;</tspan>
      <tspan x="0" dy="54">Mekan Koku Mimarisi</tspan>
    </text>

    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#a6b4bf">
      <tspan x="0" dy="0">Isıtmasız nano-zerrecik teknolojisi ve</tspan>
      <tspan x="0" dy="28">prestijli notalarla kurumsal kimlik inşası.</tspan>
    </text>

    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="95" height="32" rx="16" fill="#263238" stroke="#d4af37" stroke-width="1.2"/>
      <text x="47" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f5d77f" text-anchor="middle">NextLab</text>

      <rect x="105" y="0" width="160" height="32" rx="16" fill="#263238" stroke="#d4af37" stroke-width="1.2"/>
      <text x="185" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f5d77f" text-anchor="middle">Crystal &amp; Surrender</text>

      <rect x="275" y="0" width="165" height="32" rx="16" fill="#263238" stroke="#d4af37" stroke-width="1.2"/>
      <text x="357" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f5d77f" text-anchor="middle">Ortam Kokulandırma</text>
    </g>
  </g>

  <!-- Illustration on Right: Nextlab Diffuser Machine + Amber Crystal Fragrance Bottle -->
  <g transform="translate(800, 150)" filter="url(#shadow6)">
    <!-- Diffuser Machine Tower (Minimalist Matte Black / White) -->
    <rect x="-80" y="80" width="110" height="250" rx="14" fill="#1e272e" stroke="#485460" stroke-width="2"/>
    <rect x="-70" y="95" width="90" height="8" rx="4" fill="#05c46b"/>
    <text x="-25" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" letter-spacing="3" fill="#ffffff" text-anchor="middle">NEXTLAB</text>
    <text x="-25" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" letter-spacing="1" fill="#808e9b" text-anchor="middle">COLD DIFFUSION</text>
    <ellipse cx="-25" cy="80" rx="30" ry="10" fill="#2f3542"/>
    <path d="M -25,75 Q -25,30 -5,10" stroke="#d4af37" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M -25,75 Q -35,40 -20,20" stroke="#d4af37" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>

    <!-- Amber Fragrance Flacon Bottle -->
    <g transform="translate(60, 90)">
      <rect x="0" y="50" width="120" height="190" rx="20" fill="#593c1d" stroke="#d4af37" stroke-width="1.8"/>
      <!-- Label -->
      <rect x="15" y="90" width="90" height="110" rx="6" fill="#fdfbf7"/>
      <text x="60" y="125" font-family="'Playfair Display', serif" font-size="12" font-weight="800" fill="#1c252e" text-anchor="middle">CRYSTAL</text>
      <line x1="30" y1="135" x2="90" y2="135" stroke="#d4af37" stroke-width="1"/>
      <text x="60" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" letter-spacing="1" fill="#7f8c8d" text-anchor="middle">CITRUS &amp; AMBER</text>
      <text x="60" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="700" fill="#1c252e" text-anchor="middle">350 ML • NEXTLAB</text>
      <!-- Cap -->
      <rect x="35" y="20" width="50" height="30" rx="6" fill="url(#gold-foil)"/>
    </g>

    <!-- Floating golden fragrance mist particles -->
    <circle cx="10" cy="30" r="5" fill="#f5d77f"/>
    <circle cx="-5" cy="5" r="3" fill="#f5d77f"/>
    <circle cx="35" cy="10" r="4" fill="#f5d77f" opacity="0.6"/>
  </g>
</svg>
